name: astrbot_plugin_natural_proactive
display_name: 自然主动冒泡
short_desc: 随机抖动的拟人主动消息：同源人设、时间感知语境、可选群聊破冰与扩展 API
desc: >-
  Generic AstrBot plugin for human-like proactive messaging: persona and
